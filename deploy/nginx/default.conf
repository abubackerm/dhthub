# ── Catalog API proxy cache ──────────────────────────────────────────
# Stores gzipped catalog responses from the NestJS API origin.
# Sized for ~5 000 leaf slugs × 4 endpoints × ~20 KB avg compressed ≈ 400 MB.
# Nginx delegates compression to the origin (Fastify @fastify/compress)
# so the cache key includes Accept-Encoding and stores pre-compressed blobs.
# TTL: 60 s — freshness is driven by Redis read-through + on-demand revalidation.
proxy_cache_path /var/cache/nginx/catalog
    levels=1:2
    keys_zone=catalog_api_cache:100m
    max_size=500m
    inactive=2m;

# ── HTTP → HTTPS redirect ────────────────────────────────────────────
server {
    listen 80;
    server_name www.verdeum.in verdeum.in;

    # Custom log format with cache status tracking
    log_format cache_detailed '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              'cache=$upstream_cache_status '
                              'rt=$request_time uct=$upstream_connect_time '
                              'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log cache_detailed;
    error_log /var/log/nginx/error.log warn;

    # Redirect non-www to www
    if ($host = verdeum.in) {
        return 301 https://www.verdeum.in$request_uri;
    }

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Non-www → www redirect (HTTPS) ───────────────────────────────────
server {
    listen 443 ssl http2;
    server_name verdeum.in;

    # Redirect non-www to www
    return 301 https://www.verdeum.in$request_uri;
}

# ── Main HTTPS server ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name www.verdeum.in;

    # Custom log format with cache status tracking and timing metrics
    # cache field: HIT/MISS/EXPIRED/BYPASS/NONE — shows if Nginx proxy_cache served the response
    # rt/uct/uht/urt: total/request/connect/header/response times in seconds
    log_format cache_detailed '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              'cache=$upstream_cache_status '
                              'rt=$request_time uct=$upstream_connect_time '
                              'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log cache_detailed;
    error_log /var/log/nginx/error.log warn;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/www.verdeum.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.verdeum.in/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Max upload size (match Fastify 200MB limit)
    client_max_body_size 200M;

    # ── Catalog API (cached) ─────────────────────────────────────────
    # Caches GET responses for public catalog endpoints: category tree,
    # leaf/consolidated/filter data, and product by-slug.  Nginx stores
    # the gzipped response from the origin so downstream clients get
    # cached bytes without re-compression.  Write/admin endpoints are
    # excluded via the more-specific /api/ catch-all below.
    location /api/v1/catalog/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Cache settings
        proxy_cache catalog_api_cache;
        proxy_cache_key $scheme$host$request_uri$http_accept_encoding;
        proxy_cache_valid 200 302 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        # Never serve cached responses to authenticated users, and never
        # store auth-bearing responses in the public cache.
        proxy_cache_bypass $http_authorization $cookie_session_token;
        proxy_no_cache $http_authorization $cookie_session_token;

        # Re-declare security headers (Nginx drops parent-level add_header
        # directives inside child location blocks).
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Cache-Status $upstream_cache_status always;

        # Compression delegation: Nginx does NOT compress; origin does.
        # We always send Accept-Encoding: gzip so the origin returns a
        # gzipped body, and we cache that compressed blob as-is.
        gzip off;
        gzip_proxied off;
        proxy_set_header Accept-Encoding "gzip";

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Category tree is backed by Redis read-through (TTL 300s) — skip
    # the 60s Nginx proxy cache to avoid serving stale data.
    location /api/v1/catalog/categories/tree {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        gzip off;
        gzip_proxied off;
        proxy_set_header Accept-Encoding "gzip";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # ── General API proxy (uncached — admin / auth / mutations) ──────
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SeaweedFS Filer proxy
    location /seaweed/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Next.js static assets (immutable, long-lived cache)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js proxy (everything else)
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # Let's Encrypt challenge for renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}
