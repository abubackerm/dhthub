# ── Catalog API proxy cache ──────────────────────────────────────────
# Stores gzipped catalog responses from the NestJS API origin.
# TTL: 60 s — freshness is driven by Redis read-through + on-demand revalidation.
proxy_cache_path /var/cache/nginx/catalog
    levels=1:2
    keys_zone=catalog_api_cache:100m
    max_size=500m
    inactive=2m;

# ── Custom log format ────────────────────────────────────────────────
log_format cache_detailed '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'cache=$upstream_cache_status '
                          'rt=$request_time uct=$upstream_connect_time '
                          'uht=$upstream_header_time urt=$upstream_response_time';

# ── HTTP → HTTPS redirect ────────────────────────────────────────────
server {
    listen 80;
    server_name www.verdeum.in verdeum.in;

    access_log /var/log/nginx/access.log cache_detailed;
    error_log /var/log/nginx/error.log warn;

    # Redirect non-www to www
    if ($host = verdeum.in) {
        return 301 https://www.verdeum.in$request_uri;
    }

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Non-www → www redirect (HTTPS) ───────────────────────────────────
server {
    listen 443 ssl http2;
    server_name verdeum.in;

    ssl_certificate /etc/letsencrypt/live/www.verdeum.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.verdeum.in/privkey.pem;

    return 301 https://www.verdeum.in$request_uri;
}

# ── Main HTTPS server ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name www.verdeum.in;

    ssl_certificate /etc/letsencrypt/live/www.verdeum.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.verdeum.in/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/access.log cache_detailed;
    error_log /var/log/nginx/error.log warn;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Max upload size (match Fastify 200MB limit)
    client_max_body_size 200M;

    # ── Catalog API (cached) ─────────────────────────────────────────
    # Strip /api prefix: /api/v1/catalog/* -> /v1/catalog/*
    location /api/v1/catalog/ {
        rewrite ^/api(/v1/catalog/.*) $1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Cache settings
        proxy_cache catalog_api_cache;
        proxy_cache_key $scheme$host$request_uri$http_accept_encoding;
        proxy_cache_valid 200 302 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        proxy_cache_bypass $http_authorization $cookie_session_token;
        proxy_no_cache $http_authorization $cookie_session_token;

        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Cache-Status $upstream_cache_status always;

        gzip off;
        gzip_proxied off;
        proxy_set_header Accept-Encoding "gzip";

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Category tree — skip Nginx cache (Redis read-through is primary)
    location /api/v1/catalog/categories/tree {
        rewrite ^/api(/v1/catalog/categories/tree.*) $1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        gzip off;
        gzip_proxied off;
        proxy_set_header Accept-Encoding "gzip";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # ── General API proxy (uncached — admin / auth / mutations) ──────
    # Strip /api prefix from v1 routes, pass /api/auth/ through as-is
    location /api/ {
        rewrite ^/api/v1(/.*) /v1$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Direct v1 API proxy (for client-side requests from same domain) ──
    # Used when NEXT_PUBLIC_API_URL points to the public domain (www.verdeum.in)
    # so that session cookies are properly included in API requests.
    location /v1/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SeaweedFS Filer proxy
    location /seaweed/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Next.js static assets (immutable, long-lived cache)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js proxy (everything else)
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # Let's Encrypt challenge for renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}
